[phases.setup]
nixPkgs = ["rustc_1_94", "cargo_1_94", "gcc"]

[phases.install]
cmds = ["cargo fetch"]

[phases.build]
cmds = ["cargo build --release"]

# [phases.postBuild]
# cmds = ["cp -r docs ./target/release/"]

[start]
# cmd = "./target/release/jjinx --config docs/jjinx.conf"
cmd = "tail -f /dev/null"

[env]
RUSTFLAGS = "-C target-cpu=native"