server {
    default

    route = / {
        file index.html
    }

    route ^~ /index.html {
        file index.html
    }

    route ~ .* {
        status 404
    }

    route ^~ /get-host {
        body "Host: $host\n"
    }

    route ^~ /example-proxy {
        proxy http://localhost:8000
    }

    route ^~ /path-proxy/ {
        proxy http://localhost:8000/api/
    }
}
